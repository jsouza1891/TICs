<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6fed">
  <title>TICS APP</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/logo-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-estado="cargando">
  <!-- Pantalla de inicio de sesión: la app solo se muestra con una sesión iniciada -->
  <section id="pantallaLogin" class="login">
    <img src="img/logo-512.png" alt="TICs" class="login-logo" width="140" height="140">
    <p class="login-cargando">Cargando…</p>
    <div class="login-panel">
      <h1>Iniciar sesión</h1>
      <form id="formLogin" class="formulario">
        <input name="email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Usuario o correo" required>
        <input name="clave" type="password" autocomplete="current-password" placeholder="Contraseña" required>
        <button type="submit">Ingresar</button>
      </form>
      <button id="btnOlvide" class="enlace" type="button">¿Olvidaste tu contraseña?</button>
      <div class="separador"><span>o</span></div>
      <button id="btnGoogle" class="secundario ancho" type="button">Continuar con Google</button>
      <p id="loginError" class="login-error" role="alert"></p>
    </div>
  </section>

  <header class="topbar">
    <div class="marca">
      <button class="icon menu-btn" id="btnMenu" aria-label="Abrir menú">☰</button>
      <img src="img/logo-encabezado.png" alt="TICs" height="36">
      <h1 id="titulo">Órdenes</h1>
    </div>
    <div class="mes" style="visibility: hidden">
      <button class="icon" id="mesPrev" aria-label="Mes anterior">‹</button>
      <span id="mesLabel"></span>
      <button class="icon" id="mesNext" aria-label="Mes siguiente">›</button>
    </div>
  </header>

  <!-- Panel lateral con las secciones (en el celular se abre con ☰) -->
  <nav class="lateral" id="lateral">
    <img src="img/logo-encabezado.png" alt="TICs" class="lateral-logo" height="40">
    <button data-vista="ordenes" class="activo"><span>📋</span>Órdenes</button>
    <button data-vista="clientes"><span>👥</span>Clientes</button>
    <button data-vista="dinero"><span>💰</span>Dinero</button>
    <button data-vista="cuenta"><span>⚙️</span>Cuenta</button>
  </nav>
  <div class="velo" id="velo"></div>

  <main>
    <!-- ÓRDENES DE TRABAJO (se guardan en la colección "agenda") -->
    <section id="vista-ordenes" class="vista activa">
      <div class="barra-acciones">
        <input type="search" id="buscarOrden" placeholder="Buscar orden o cliente…">
        <button id="btnNuevaOrden">+ Nueva orden</button>
      </div>
      <label class="check"><input type="checkbox" id="verHechos"> Mostrar realizadas</label>
      <div id="listaAgenda"></div>
    </section>

    <!-- CLIENTES -->
    <section id="vista-clientes" class="vista">
      <div class="barra-acciones">
        <input type="search" id="buscarCliente" placeholder="Buscar cliente…">
        <button id="btnNuevoCliente">+ Nuevo cliente</button>
      </div>
      <ul id="listaClientes" class="lista"></ul>
    </section>

    <!-- DINERO: resumen del mes y movimientos -->
    <section id="vista-dinero" class="vista">
      <div class="cajas" id="cajas"></div>

      <h2>Gastos por categoría</h2>
      <div id="porCategoria" class="barras"></div>

      <h2>Movimientos</h2>
      <form id="formMov" class="formulario">
        <div class="segmentado" role="radiogroup">
          <label><input type="radio" name="tipo" value="gasto" checked><span>Gasto</span></label>
          <label><input type="radio" name="tipo" value="ingreso"><span>Ingreso</span></label>
        </div>
        <div class="fila precio">
          <select name="moneda"><option value="UYU">$ pesos</option><option value="USD">US$ dólares</option></select>
          <input name="monto" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="Monto" required>
        </div>
        <input name="fecha" type="date" required>
        <select name="categoria" id="selCategoria"></select>
        <input name="descripcion" placeholder="Descripción (opcional)" maxlength="120">
        <button type="submit">Guardar movimiento</button>
      </form>
      <div class="filtros" id="filtrosMov">
        <button data-filtro="todos" class="chip activo">Todos</button>
        <button data-filtro="gasto" class="chip">Gastos</button>
        <button data-filtro="ingreso" class="chip">Ingresos</button>
      </div>
      <div class="filtros" id="filtrosMoneda">
        <button data-moneda="todas" class="chip activo">Ambas</button>
        <button data-moneda="UYU" class="chip">Pesos</button>
        <button data-moneda="USD" class="chip">Dólares</button>
      </div>
      <ul id="listaMov" class="lista"></ul>
    </section>
    <!-- CUENTA -->
    <section id="vista-cuenta" class="vista">
      <h2>Sincronización</h2>
      <div id="cuenta"></div>

      <h2>Respaldo</h2>
      <div class="fila-botones">
        <button id="btnExportar" class="secundario">Exportar datos</button>
        <label class="boton secundario">Importar datos
          <input type="file" id="inputImportar" accept="application/json" hidden>
        </label>
      </div>
      <p class="ayuda">Descarga una copia de todos tus datos en un archivo, por las dudas.</p>
    </section>
  </main>

  <!-- Crear / editar orden -->
  <dialog id="dlgOrden" class="detalle">
    <div class="detalle-cab">
      <div class="detalle-titulo" id="dlgOrdenTitulo">Nueva orden</div>
      <button class="icon" type="button" data-cerrar aria-label="Cerrar">✕</button>
    </div>
    <form id="formOrden" class="formulario">
      <input name="titulo" placeholder="Trabajo a realizar" required maxlength="120">
      <label class="etiqueta-campo">Cliente
        <select name="clienteId"></select>
      </label>
      <label class="etiqueta-campo">Fecha de entrega
        <div class="fila">
          <input name="fecha" type="date" required>
          <input name="hora" type="time">
        </div>
      </label>
      <textarea name="nota" rows="3" maxlength="2000" placeholder="Detalles del trabajo (opcional)"></textarea>
      <label class="etiqueta-campo">Precio del servicio (opcional)
        <div class="fila precio">
          <select name="moneda"><option value="UYU">$ pesos</option><option value="USD">US$ dólares</option></select>
          <input name="precio" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Precio">
        </div>
      </label>
      <button type="submit">Guardar orden</button>
    </form>
  </dialog>

  <!-- Detalle de una orden: datos, estado y novedades -->
  <dialog id="detalle" class="detalle">
    <div class="detalle-cab">
      <div class="detalle-titulo" id="detTitulo"></div>
      <button class="icon" id="detCerrar" aria-label="Cerrar">✕</button>
    </div>
    <dl class="datos" id="detDatos"></dl>
    <label class="check"><input type="checkbox" id="detHecho"> Trabajo realizado</label>
    <div class="sec" id="detHechoEn"></div>
    <div class="fila-botones acciones-detalle">
      <button id="detEditar" class="secundario">✏️ Editar</button>
      <button id="detEliminar" class="secundario peligro">Eliminar</button>
    </div>
    <h2>Novedades</h2>
    <ul id="detActualizaciones" class="bitacora"></ul>
    <form id="formActualizacion" class="formulario">
      <textarea name="texto" rows="3" maxlength="1000" placeholder="Agregar novedad o avance…" required></textarea>
      <button type="submit">Agregar novedad</button>
    </form>
  </dialog>

  <!-- Crear / editar cliente -->
  <dialog id="dlgCliente" class="detalle">
    <div class="detalle-cab">
      <div class="detalle-titulo" id="dlgClienteTitulo">Nuevo cliente</div>
      <button class="icon" type="button" data-cerrar aria-label="Cerrar">✕</button>
    </div>
    <form id="formCliente" class="formulario">
      <input name="nombre" placeholder="Nombre o empresa" required maxlength="120">
      <input name="telefono" type="tel" placeholder="Teléfono (ej. 099 123 456)" maxlength="40">
      <input name="email" type="email" placeholder="Correo (opcional)" maxlength="120">
      <input name="direccion" placeholder="Dirección (opcional)" maxlength="200">
      <input name="rut" placeholder="RUT / razón social (opcional)" maxlength="120">
      <textarea name="notas" rows="3" maxlength="1000" placeholder="Notas (opcional)"></textarea>
      <button type="submit">Guardar cliente</button>
    </form>
  </dialog>

  <!-- Ficha de cliente: datos, contacto y sus órdenes -->
  <dialog id="dlgVerCliente" class="detalle">
    <div class="detalle-cab">
      <div class="detalle-titulo" id="cliNombre"></div>
      <button class="icon" type="button" data-cerrar aria-label="Cerrar">✕</button>
    </div>
    <dl class="datos" id="cliDatos"></dl>
    <div class="fila-botones" id="cliContacto"></div>
    <div class="fila-botones acciones-detalle">
      <button id="cliNuevaOrden">+ Nueva orden</button>
      <button id="cliEditar" class="secundario">✏️ Editar</button>
      <button id="cliEliminar" class="secundario peligro">Eliminar</button>
    </div>
    <h2>Órdenes</h2>
    <ul id="cliOrdenes" class="lista"></ul>
  </dialog>

  <!-- Cambio de contraseña para usuarios con contraseña -->
  <dialog id="dlgClave" class="detalle">
    <div class="detalle-cab">
      <div class="detalle-titulo">Cambiar contraseña</div>
      <button class="icon" type="button" id="dlgClaveCerrar" aria-label="Cerrar">✕</button>
    </div>
    <form id="formClave" class="formulario">
      <input name="actual" type="password" autocomplete="current-password" placeholder="Contraseña actual" required>
      <input name="nueva" type="password" autocomplete="new-password" placeholder="Contraseña nueva (mínimo 6 caracteres)" minlength="6" required>
      <input name="repetir" type="password" autocomplete="new-password" placeholder="Repetir contraseña nueva" minlength="6" required>
      <button type="submit">Guardar contraseña</button>
      <p id="claveError" class="login-error" role="alert"></p>
    </form>
  </dialog>

  <div id="toast" role="status"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
