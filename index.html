<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6fed">
  <title>Mi Asistente</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/logo-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="marca">
      <img src="img/logo-encabezado.png" alt="TICs" height="36">
      <h1 id="titulo">Agenda</h1>
    </div>
    <div class="mes" style="visibility: hidden">
      <button class="icon" id="mesPrev" aria-label="Mes anterior">‹</button>
      <span id="mesLabel"></span>
      <button class="icon" id="mesNext" aria-label="Mes siguiente">›</button>
    </div>
  </header>

  <main>
    <!-- AGENDA -->
    <section id="vista-agenda" class="vista activa">
      <form id="formAgenda" class="formulario">
        <div class="segmentado" role="radiogroup">
          <label><input type="radio" name="area" value="personal" checked><span>Personal</span></label>
          <label><input type="radio" name="area" value="laboral"><span>Laboral</span></label>
        </div>
        <input name="titulo" placeholder="¿Qué tenés que hacer?" required maxlength="120">
        <div class="fila">
          <input name="fecha" type="date" required>
          <input name="hora" type="time">
        </div>
        <input name="nota" placeholder="Nota (opcional)" maxlength="300">
        <button type="submit">Agregar a la agenda</button>
      </form>
      <div class="filtros" id="filtrosAgenda">
        <button data-area="todas" class="chip activo">Todas</button>
        <button data-area="personal" class="chip">Personal</button>
        <button data-area="laboral" class="chip">Laboral</button>
      </div>
      <label class="check"><input type="checkbox" id="verHechos"> Mostrar completados</label>
      <div id="listaAgenda"></div>
    </section>

    <!-- DINERO: resumen del mes y movimientos -->
    <section id="vista-dinero" class="vista">
      <div class="tarjetas">
        <div class="tarjeta ingreso"><span>Ingresos</span><strong id="totIngresos">$0</strong></div>
        <div class="tarjeta gasto"><span>Gastos</span><strong id="totGastos">$0</strong></div>
        <div class="tarjeta balance"><span>Balance</span><strong id="totBalance">$0</strong></div>
      </div>

      <h2>Gastos por categoría</h2>
      <div id="porCategoria" class="barras"></div>

      <h2>Movimientos</h2>
      <form id="formMov" class="formulario">
        <div class="segmentado" role="radiogroup">
          <label><input type="radio" name="tipo" value="gasto" checked><span>Gasto</span></label>
          <label><input type="radio" name="tipo" value="ingreso"><span>Ingreso</span></label>
        </div>
        <div class="fila">
          <input name="monto" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="Monto" required>
          <input name="fecha" type="date" required>
        </div>
        <select name="categoria" id="selCategoria"></select>
        <input name="descripcion" placeholder="Descripción (opcional)" maxlength="120">
        <button type="submit">Guardar movimiento</button>
      </form>
      <div class="filtros">
        <button data-filtro="todos" class="chip activo">Todos</button>
        <button data-filtro="gasto" class="chip">Gastos</button>
        <button data-filtro="ingreso" class="chip">Ingresos</button>
      </div>
      <ul id="listaMov" class="lista"></ul>
    </section>
    <!-- CUENTA -->
    <section id="vista-cuenta" class="vista">
      <h2>Sincronización</h2>
      <div id="cuenta"></div>

      <h2>Respaldo</h2>
      <div class="fila-botones">
        <button id="btnExportar" class="secundario">Exportar datos</button>
        <label class="boton secundario">Importar datos
          <input type="file" id="inputImportar" accept="application/json" hidden>
        </label>
      </div>
      <p class="ayuda">Descarga una copia de todos tus datos en un archivo, por las dudas.</p>
    </section>
  </main>

  <nav class="tabs">
    <button data-vista="agenda" class="activo"><span>📅</span>Agenda</button>
    <button data-vista="dinero"><span>💰</span>Dinero</button>
    <button data-vista="cuenta"><span>⚙️</span>Cuenta</button>
  </nav>

  <div id="toast" role="status"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
